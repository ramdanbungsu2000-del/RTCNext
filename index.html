const MAX=4;let rm=null,ls,inc=null,tm=0,prev='home',pend={};const out={};
const dial=c=>callTo([c]);
function sig(to,type,data={}){
 out[to]=out[to]||new Promise(r=>{const ch=sb.channel('in:'+to);ch.subscribe(s=>s=='SUBSCRIBED'&&r(ch))});
 out[to].then(ch=>ch.send({type:'broadcast',event:'s',payload:{type,from:me.id,name:me.name,...data}}))}
const rsig=(type,data={})=>rm&&rm.ch.send({type:'broadcast',event:'r',payload:{type,from:me.id,name:me.name,...data}});
const cnt=()=>Object.keys(rm.ps).length+Object.keys(pend).length+1,chk=()=>{if(rm&&!Object.keys(rm.ps).length&&!Object.keys(pend).length)end(1,'Panggilan selesai')};
function ui(name,st,incoming){if(!$('#call').classList.contains('on'))prev=document.querySelector('.scr.on').id;

function drawPl(){if(!rm)return;const a=['<span class="chip on">Kamu</span>'],n=[];
 Object.values(rm.ps).forEach(o=>{n.push(o.name);a.push(`<span class="chip ${o.st=='connected'?'on':''}">${esc(o.name)}</span>`)});
 Object.values(pend).forEach(o=>{n.push(o.name);a.push(`<span class="chip">${esc(o.name)} memanggil</span>`)});
 a.push(`<span class="chip">${cnt()}/${MAX}</span>`);$('#pl').innerHTML=a.join('');if(n.length){$('#pn').textContent=n.join(', ');$('#pav').textContent=n[0][0].toUpperCase()}}
async function enter(room,g){
 ls=await navigator.mediaDevices.getUserMedia({audio:true});rm={id:room,g,ps:{},qq:{}};
 const ch=rm.ch=sb.channel('room:'+room);ch.on('broadcast',{event:'r'},({payload})=>onRoom(payload));
 await new Promise((ok,no)=>ch.subscribe(s=>{if(s=='SUBSCRIBED')ok();if(s=='CHANNEL_ERROR'||s=='TIMED_OUT')no(Error('room'))}))}
async function callTo(list,g){
 if(rm||inc)return toast('Sedang dalam panggilan');ui(list[0].name,'Memanggil...',false);
 try{await enter(crypto.randomUUID(),g)}catch(e){return end(0,'Mikrofon atau koneksi bermasalah')}
 list.slice(0,MAX-1).forEach(invite);drawPl()}
function invite(c){if(!rm||cnt()>=MAX)return toast('Maksimal 4 peserta');
 pend[c.id]={name:c.name,t:setTimeout(()=>{delete pend[c.id];toast(c.name+' tidak menjawab');drawPl();chk()},30000)};
 sig(c.id,'ring',{room:rm.id,gname:rm.g});drawPl()}

 if(!l.length)return toast('Belum ada anggota lain yang bergabung');if(l.length>MAX-1)toast('Maksimal 4 peserta, 3 anggota pertama dihubungi');callTo(l,g.name)}
async function mkPeer(id,name,off){
 const pc=new RTCPeerConnection({iceServers:await ice()});if(!rm||!ls){pc.close();return}
 const au=new Audio(),o=rm.ps[id]={name,pc,au,q:rm.qq[id]||[],st:'connecting'};delete rm.qq[id];au.autoplay=true;au.volume=cfg.cv;
 ls.getTracks().forEach(t=>pc.addTrack(t,ls));
 pc.onicecandidate=e=>e.candidate&&rsig('ice',{to:id,c:e.candidate.toJSON()});
 pc.ontrack=e=>{au.srcObject=e.streams[0];au.play().catch(()=>{})};
 pc.onconnectionstatechange=()=>{if(!rm||rm.ps[id]!==o)return;o.st=pc.connectionState;if(o.st=='connected')started();if(o.st=='failed')drop(id);drawPl()};
 if(off){const d=await pc.createOffer();await pc.setLocalDescription(d);rsig('offer',{to:id,sdp:{type:d.type,sdp:d.sdp}})}
 drawPl();return o}
const flush=async o=>{for(const c of o.q.splice(0))await o.pc.addIceCandidate(c).catch(()=>{})};
const started=()=>{if(tm)return;let t=0;tm=setInterval(()=>$('#ps').textContent=String(t/60|0).padStart(2,'0')+':'+String(t++%60).padStart(2,'0'),1000)};
function drop(id){const o=rm&&rm.ps[id];if(!o)return;o.pc.close();o.au.srcObject=null;delete rm.ps[id];drawPl();chk()}
async function onRoom(p){
 if(!rm||p.from==me.id)return;const t=p.type;
 if(t=='hi'){if(rm.ps[p.from])return;if(Object.keys(rm.ps).length+1>=MAX)return rsig('full',{to:p.from});
  if(pend[p.from]){clearTimeout(pend[p.from].t);delete pend[p.from]}await mkPeer(p.from,p.name,true)}
 else if(t=='bye')drop(p.from);
 else if(p.to!=me.id)return;
 else if(t=='offer'){const old=rm.ps[p.from];if(old){if(old.pc.signalingState=='have-local-offer'&&me.id>p.from)return;old.pc.close();delete rm.ps[p.from]}
  const o=await mkPeer(p.from,p.name,false);if(!o)return;
  await o.pc.setRemoteDescription(p.sdp);await flush(o);const a=await o.pc.createAnswer();await o.pc.setLocalDescription(a);rsig('answer',{to:p.from,sdp:{type:a.type,sdp:a.sdp}})}
 else if(t=='answer'){const o=rm.ps[p.from];if(o&&o.pc.signalingState=='have-local-offer'){await o.pc.setRemoteDescription(p.sdp);await flush(o)}}
 else if(t=='ice'){const o=rm.ps[p.from];o&&o.pc.remoteDescription?o.pc.addIceCandidate(p.c).catch(()=>{}):(o?o.q:(rm.qq[p.from]=rm.qq[p.from]||[])).push(p.c)}
 else if(t=='full')end(0,'Panggilan penuh')}
function onSig(p){
 if(p.type=='ring'){if(rm||inc||bl.has(p.from))return sig(p.from,'dec',{room:p.room});inc=p;ui(p.name,p.gname?'Undangan grup '+p.gname:'Panggilan masuk',true);ring(cfg.rt,cfg.rv)}
 else if(p.type=='cancel'&&inc&&inc.room==p.room){inc=null;end(0,'Panggilan dibatalkan')}
 else if(p.type=='dec'&&pend[p.from]){clearTimeout(pend[p.from].t);delete pend[p.from];drawPl();chk()}}
$('#acc').onclick=async()=>{const p=inc;if(!p)return;inc=null;stopRing();$('#call').classList.remove('in');$('#ps').textContent='Menghubungkan...';
 try{await enter(p.room,p.gname)}catch(e){sig(p.from,'dec',{room:p.room});return end(0,'Mikrofon atau koneksi bermasalah')}
 rsig('hi');drawPl();const id=rm.id;setTimeout(()=>rm&&rm.id==id&&!Object.keys(rm.ps).length&&end(1,'Panggilan sudah berakhir'),15000)};
$('#rej').onclick=()=>end(1,'Ditolak');$('#hup').onclick=()=>end(1,'Panggilan selesai');
$('#mut').onclick=()=>{const t=ls&&ls.getAudioTracks()[0];if(t){t.enabled=!t.enabled;$('#mut').classList.toggle('off',!t.enabled)}};
$('#inv').onclick=()=>{if(!rm)return;const left=MAX-cnt();if(left<=0)return toast('Maksimal 4 peserta');
 const busy=new Set([...Object.keys(rm.ps),...Object.keys(pend)]);
 pick('Undang ke panggilan',ct.filter(c=>!busy.has(c.id)),left,'Undang',sel=>{sel.forEach(invite);show('call')},'call')};
function end(notify,msg){
 if(rm){const r=rm;rm=null;if(notify)r.ch.send({type:'broadcast',event:'r',payload:{type:'bye',from:me.id}});
  Object.values(r.ps).forEach(o=>{o.pc.close();o.au.srcObject=null});
  Object.entries(pend).forEach(([i,o])=>{clearTimeout(o.t);notify&&sig(i,'cancel',{room:r.id})});pend={};setTimeout(()=>sb.removeChannel(r.ch),300)}
 else if(inc&&notify)sig(inc.from,'dec',{room:inc.room});
 stopRing();inc=null;ls&&ls.getTracks().forEach(t=>t.stop());ls=null;clearInterval(tm);tm=0;
 $('#mut').classList.remove('off');$('#call').classList.remove('in');$('#pl').innerHTML='';$('#ps').textContent=msg;toast(msg);setTimeout(()=>show(prev),900)}

// ===== TURN Metered + pengaturan panggilan =====
let iceC=null,iceT=0,iceX=0,turnOk=null,cfg={rt:'klasik',rv:.8,cv:1},ac,rtT=0,nf=[],bl=new Set(),ndT=0;
try{cfg={...cfg,...JSON.parse(localStorage.getItem('rtc_cfg')||'{}')}}catch(e){}
const save=()=>{try{localStorage.setItem('rtc_cfg',JSON.stringify(cfg))}catch(e){}};
const STUN=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun2.l.google.com:19302'}];
async function ice(){if(iceC&&Date.now()-iceT<iceX)return iceC;let s=STUN,ok=false;
 try{const{data}=await sb.auth.getSession(),t=data.session&&data.session.access_token;
  if(t){const j=await(await fetch('/api/turn',{headers:{Authorization:'Bearer '+t}})).json();if(Array.isArray(j)&&j.length){s=STUN.concat(j);ok=true}}}catch(e){}
 turnOk=ok;iceC=s;iceT=Date.now();iceX=ok?6e5:15e3;return s}
const RT={klasik:{n:'Klasik',p:[[880,.22],[0,.12],[880,.22],[0,.12],[880,.22],[0,1]]},
 kilat:{n:'Kilat',p:[[1400,.07],[2200,.07],[1000,.07],[2600,.07],[0,.14],[1400,.07],[2200,.07],[1000,.07],[2600,.07],[0,.9]]},
 lembut:{n:'Lembut',p:[[523,.45],[659,.45],[784,.6],[0,.9]]},senyap:{n:'Senyap',p:null}};
addEventListener('pointerdown',()=>{ac=ac||new AudioContext();ac.resume()},{once:true});
function ring(k,vol,once){stopRing();const p=RT[k]&&RT[k].p;if(!p||vol<=0)return;ac=ac||new AudioContext();ac.resume();
 const go=()=>{let t=ac.currentTime;p.forEach(([f,d])=>{if(f){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.setValueAtTime(vol*.6,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}t+=d});return(t-ac.currentTime)*1000};
 const len=go();if(!once)rtT=setInterval(go,len)}
const stopRing=()=>{clearInterval(rtT);rtT=0};
function drawRT(){const L=$('#rtl');L.innerHTML='';Object.keys(RT).forEach((k,i)=>{
 const r=rowEl(i,`<div class="av">${ic(k=='senyap'?'mute':'music')}</div><span>${RT[k].n}</span><span class="ck">${ic('check')}</span>`);
 r.classList.toggle('sel',cfg.rt==k);r.onclick=()=>{cfg.rt=k;save();drawRT();ring(k,cfg.rv,true)};L.append(r)})}
function sl(id,lab,key,fn){const e=$(id);e.value=Math.round(cfg[key]*100);$(lab).textContent=e.value+'%';
 e.oninput=()=>{cfg[key]=e.value/100;$(lab).textContent=e.value+'%';save();fn&&fn()}}
$('#gear').onclick=()=>show('st');$('#stb').onclick=()=>show('home');$('#scb').onclick=()=>{stopRing();show('st')};
$('#mc').onclick=()=>{drawRT();sl('#rv','#rvv','rv');$('#rv').onchange=()=>ring(cfg.rt,cfg.rv,true);
 sl('#cv','#cvv','cv',()=>rm&&Object.values(rm.ps).forEach(o=>o.au.volume=cfg.cv));
 $('#tn').textContent=turnOk?'Server TURN Metered: aktif':'Server TURN Metered: belum aktif. Pastikan METERED_APP, METERED_KEY, SUPABASE_URL, SUPABASE_KEY sudah diisi di Environment Variables Vercel, lalu deploy ulang.';show('sc')};
// ===== Notifikasi + persetujuan kontak baru =====
const loadB=async()=>{const{data}=await sb.from('blocks').select('blocked');bl=new Set((data||[]).map(x=>x.blocked))};
async function loadN(){const{data}=await sb.from('notifs').select('*').order('created_at',{ascending:false}).limit(50);nf=data||[];drawBadge();if($('#nt').classList.contains('on'))drawN()}
function drawBadge(){const u=nf.filter(n=>!n.read).length;$('#nb').hidden=!u;$('#nb').textContent=u;$('#bn').classList.toggle('has',u>0)}
function drawN(){const l=$('#nl');l.innerHTML=nf.length?'':'<p class="mt">Belum ada aktivitas</p>';
 nf.forEach((n,i)=>{const c=n.kind=='contact_add',t=c?`${esc(n.from_name)} menambahkan kamu sebagai kontak`:`${esc(n.from_name)} mengundang kamu ke grup ${esc(n.ref)}`,
  st={new:c?'Perlu tindakan':'Baru',accepted:'Diterima',cancelled:'Dibatalkan',blocked:'Diblokir'}[n.status],
  r=rowEl(i,`<div class="av">${ic(c?'userplus':'users')}</div><span>${t}<br><small class="mt">${st} · ${new Date(n.created_at).toLocaleString('id',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</small></span>${ic('chev')}`);
  r.onclick=()=>openN(n);l.append(r)})}
$('#bn').onclick=async()=>{drawN();show('nt');if(nf.some(n=>!n.read)){await sb.from('notifs').update({read:true}).eq('user_id',me.id).eq('read',false);nf.forEach(n=>n.read=true);drawBadge()}};
$('#ntb').onclick=()=>show('home');
function openN(n){if(n.kind=='group_invite'){tab='g';drawHome();return show('home')}
 if(n.status!='new')return toast(n.status=='accepted'?'Sudah diterima':n.status=='blocked'?'Sudah diblokir':'Sudah dibatalkan');
 clearInterval(ndT);$('#ndd').textContent=`Dari ${n.from_name} Telah Menambah Kontak Anda Jika Anda Yakin Ini Kontak Tidak Dikenal Blokir, Atau Batal Jika Kontak Anda Merasa Dikenal Maka Terima. Hati Hati Modus Penipuan!`;
 const B=[$('#nbk'),$('#nbt'),$('#nok')];let s=10;
 const set=()=>{B.forEach(b=>b.disabled=s>0);$('#ncd').textContent=s>0?`Tombol aktif dalam ${s} detik`:'Pilih tindakan';$('#nbar').style.width=(10-s)*10+'%'};
 $('#nbar').style.transition='none';$('#nbar').style.width='0';setTimeout(()=>{$('#nbar').style.transition='';set()},50);
 ndT=setInterval(()=>{s--;set();if(s<=0)clearInterval(ndT)},1000);
 const fin=async st=>{clearInterval(ndT);await sb.from('notifs').update({status:st,read:true}).eq('id',n.id);n.status=st;await loadN();show('nt');drawN()};
 $('#nbk').onclick=async()=>{await sb.from('blocks').insert({blocked:n.from_id});bl.add(n.from_id);toast(n.from_name+' diblokir');fin('blocked')};
 $('#nbt').onclick=()=>fin('cancelled');
 $('#nok').onclick=async()=>{if(!await ask('Yakin? Resiko Penipuan Kontak Sangat Tinggi Jika Mengerti Resiko nya tekan tombol tambahkan kontak','Tambahkan Kontak','Tidak'))return fin('cancelled');
  const{error}=await sb.from('contacts').insert({owner:me.id,contact_id:n.from_id,contact_name:n.from_name});
  if(error&&error.code!='23505')return toast('Gagal menambahkan kontak');await loadC();toast('Kontak ditambahkan');fin('accepted')};
 $('#ndb').onclick=()=>{clearInterval(ndT);show('nt')};show('nd')}

// ===== Loader & boot: setiap tahap harus selesai sebelum UI ditampilkan =====
let pv=0,tg=0;const L=(t,m)=>{tg=t;m&&($('#pt').textContent=m)},wait=ms=>new Promise(r=>setTimeout(r,ms));
(function tick(){pv+=(tg-pv)*.07;if(tg-pv<.3)pv=tg;$('#pf').style.width=pv+'%';$('#pp').textContent=Math.round(pv)+'%';requestAnimationFrame(tick)})();
async function boot(){
 try{
  L(12,'Memuat font dan tampilan');
  await Promise.race([document.fonts.load("700 16px 'Space Grotesk'"),wait(3500)]);
  L(34,'Menyiapkan komponen');await wait(250);
  if(!window.supabase)throw Error('Pustaka Supabase tidak termuat, periksa internet');
  const u=String(C.SUPABASE_URL||'').replace(/\/rest\/v1\/?$/,'').replace(/\/$/,'');
  if(!/^https:\/\/.+\.supabase\.co$/.test(u)||!C.SUPABASE_KEY)throw Error('Konfigurasi Supabase belum benar');
  sb=supabase.createClient(u,C.SUPABASE_KEY);
  L(55,'Memeriksa sesi masuk');
  const{data,error}=await sb.auth.getSession();if(error)throw error;
  if(data.session){L(66,'Menyiapkan server panggilan');await ice();L(78,'Memuat kontak');await start(data.session.user)}
  L(92,'Merapikan tampilan');await wait(300);
  L(100,'Siap');while(pv<100)await wait(40);
  await wait(250);$('#ld').classList.add('off');
 }catch(e){L(tg,'Gagal: '+(e.message||e));$('#rt').hidden=false}
}
$('#rt').onclick=()=>location.reload();boot();
</script>
