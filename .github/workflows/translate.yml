name: Terjemahkan README Otomatis

on:
  push:
    branches:
      - main
    paths:
      - "README.md" # Robot hanya berjalan jika file ini berubah

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Jalankan AI Translate
        uses: FidelusAleksander/ai-translate-action@v1
        with:
          text-file: "README.md"
          target-language: "English" # Bahasa tujuan terjemahan

      - name: Commit dan Push Hasil Terjemahan
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Bot: Otomatis menerjemahkan README ke Inggris"
          file_pattern: "README.en.md" # Nama file hasil terjemahan
